<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7月回測&11月情境模擬</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2328;--ink2:#57606a;--muted:#8c959f;--line:#e5e7eb;--accent:#c2410c;--blue:#2563eb;--bg:#fff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC",sans-serif;color:var(--ink);background:#f6f7f9}
  .shell{display:flex;justify-content:center;align-items:flex-start;gap:16px;padding:18px}
  .col{flex:1 1 auto;min-width:0;max-width:1180px;display:flex;flex-direction:column;gap:16px}
  .wrap{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#fbf1ec;border-top:3px solid var(--accent)}
  .tk{font-size:30px;font-weight:700;color:var(--accent);margin-right:14px}
  .nm{font-size:19px;font-weight:700}
  .sub{font-size:13px;color:var(--ink2);margin-top:2px}
  .px{text-align:right}.px b{font-size:26px}.chg{font-size:14px;font-weight:700}
  .up{color:#d1242f}.dn{color:#1a7f37}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 22px 4px}
  .lbl{font-size:13px;color:var(--ink2);margin-right:6px}
  .grp{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .grp.vp{overflow:visible}
  .tab{position:relative;display:inline-flex;align-items:center;font-size:14px;border-right:1px solid var(--line);background:#fff}
  .tab:first-child{border-radius:999px 0 0 999px}.tab:last-child{border-right:0;border-radius:0 999px 999px 0}
  .tab .nm2{padding:6px 4px 6px 16px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .tab .sw{width:8px;height:8px;border-radius:50%;display:inline-block}
  .tab .win{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#eef1f5;color:var(--ink2);font-weight:500}
  .tab .car{padding:6px 12px 6px 6px;cursor:pointer;display:inline-flex;align-items:center;color:var(--muted)}
  .tab .car svg{width:10px;height:10px;transition:transform .15s}
  .tab.open .car svg{transform:rotate(180deg)}
  .tab.on{background:#1f2328;color:#fff}
  .tab.on .win{background:rgba(255,255,255,.16);color:#fff}
  .tab.on .car{color:#cfd4da}
  .tab.cur{box-shadow:inset 0 -3px 0 #60a5fa}
  .menu{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:none;z-index:10;color:var(--ink)}
  .tab.open .menu{display:block}
  .menu div{padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
  .menu div:hover{background:#f3f4f6}
  .menu div.sel{font-weight:700}
  .menu div.sel::after{content:"✓";color:var(--blue)}
  .menu small{color:var(--muted);font-weight:400}
  .menu .hd{font-weight:700;justify-content:flex-start;gap:8px}
  .menu .vprow{position:relative}
  .menu .vprow .cw{margin-left:auto}
  .menu .vprow .arr{color:var(--muted);font-weight:400}
  .menu .fly{position:absolute;left:calc(100% + 2px);top:-6px;min-width:130px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:none;font-weight:400}
  .menu .fly::before{content:"";position:absolute;left:-10px;top:0;width:10px;height:100%}
  .menu .vprow:hover .fly{display:block}
  .menu .vprow:hover{background:#f3f4f6}
  .menu .off{color:var(--muted)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
  .menu .box{width:14px;height:14px;border:1.5px solid #c9ced4;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex:none}
  .menu .box.on{background:var(--blue);border-color:var(--blue)}
  .menu div.sel::after{content:"●";font-size:8px}
  .legend{display:inline-flex;gap:12px;margin-left:10px}
  .legend i{width:12px;height:3px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
  .chip{padding:6px 11px;font-size:13px;cursor:pointer;border:0;border-right:1px solid var(--line);background:#fff;font-family:inherit;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
  .chip:last-child{border-right:0}
  .chip i{width:12px;height:3px;border-radius:2px;display:inline-block}
  .chip.on{color:var(--ink);font-weight:500;background:#f3f4f6}
  .chip.dis{opacity:.4;cursor:default}
  .chip:not(.on) i{opacity:.3}
  .chip.dark.on{background:#1f2328;color:#fff}
  .info{padding:8px 22px 0;font-size:13px;color:var(--ink2)}
  .info b{color:var(--ink)}
  #chart,.chartbox{position:relative;padding:6px 10px 0 10px}
  svg{display:block;width:100%}
  .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:none;white-space:nowrap;line-height:1.6}
  .notes{padding:4px 22px 16px;font-size:12px;color:var(--muted);line-height:1.7}
  .evbtn{display:inline-flex;align-items:center;gap:6px}
  .jhbtn i{width:14px;height:0;border-radius:0;border-top:2px dashed #8b5cf6;background:none}
  .evbtn i{width:9px;height:9px;border-radius:50%;border:2px solid #d1242f;display:inline-block}
  #evp{display:none;flex:0 0 340px;position:sticky;top:18px;max-height:calc(100vh - 36px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:22px;overflow:auto;box-sizing:border-box}
  #evp.show{display:block;position:sticky}
  #evp .x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
  #evp .d{font-size:13px;color:var(--ink2)}
  #evp h3{margin:6px 0 10px;font-size:19px}
  #evp .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-bottom:12px}
  #evp .tag.up{background:#fde8e8;color:#d1242f}#evp .tag.dn{background:#e6f4ea;color:#1a7f37}
  #evp p{font-size:14px;line-height:1.75;margin:0 0 10px}
  #evp .src{font-size:12px;color:var(--muted)}
  #evp .nav{display:flex;justify-content:space-between;margin-top:18px}
  .pages{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;align-self:flex-start}
  .pages button{border:0;background:none;font-family:inherit;font-size:15px;font-weight:500;padding:7px 22px;border-radius:7px;cursor:pointer;color:var(--ink2)}
  .pages button.on{background:#1f2328;color:#fff}
  .page{display:flex;flex-direction:column;gap:16px}
  .page.hide{display:none}
  #evp .nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-family:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="shell">
<div class="col" id="col">
<div class="pages" id="pages"><button data-p="etf" class="on">ETF</button><button data-p="stock">個股</button></div>
<div class="page" id="pg-etf">
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center">
      <span class="tk">SOXX</span>
      <div><div class="nm">iShares Semiconductor ETF</div></div>
    </div>
    <div class="px"><b id="last"></b><div class="chg" id="chg"></div></div>
  </header>

  <div class="bar">
    <span><span class="lbl">階段</span><span class="grp vp" id="tabs"></span></span>
    <span><span class="lbl">均線</span><span class="grp" id="mas"></span></span>
    <span><span class="lbl">事件</span><span class="grp"><button class="chip evbtn" id="evToggle"><i></i>標註事件</button></span></span>
    <span><span class="lbl">黃仁勛</span><span class="grp"><button class="chip jhbtn" id="jhToggle"><i></i></button></span></span>
    <span><span class="lbl">水位</span><span class="grp" id="fibs"></span></span>
    <span><span class="lbl">情境</span><span class="grp" id="scs"></span></span>
    <span><span class="lbl">時間範圍</span><span class="grp" id="ranges"></span></span>
  </div>
  <div class="info" id="info"></div>
  <div id="chart"><svg id="svg"></svg><div class="tip" id="tip"></div></div>
</div>
</div>
<div class="page hide" id="pg-stock"></div>
</div>
  <aside id="evp"><button class="x" id="evClose">×</button><div id="evBody"></div></aside>
</div>
<script>
const ALL = /*DATA*/;
let DATA = ALL;
const WIN = {wave:'本次', '6m':'半年', '1y':'一年'};
const MAS = [['ma20','月線20','#f59e0b'],['ma60','季線60','#7c3aed'],['ma120','半年線120','#0d9488'],['ma240','年線240','#db2777']];
const RANGES = [['3m','3 個月',null],['6m','6 個月','2026-05-01'],['1y','1 年','2025-11-24']];
const SHADE = ['#64748b','#ef4444','#f59e0b','#22c55e','#3b82f6'];
const N = DATA.nodes.length;
// 階段起訖：下跌從 6/22 高點起，其餘從上一段結束日起
// 第五段「後續」（反彈2 結束 → 最新交易日）同樣有 VPVR／均線；extra＝開啟時 x 軸才延伸到最新日
let PH = DATA.nodes.map((n,i)=>({...n, start: i? DATA.nodes[i-1].end : DATA.high, extra:n.key==='後續'}));
// open = 開啟到第幾段（連續回放，0 = 全關）；每段各自的 VPVR / 均線設定
// 預設：全部階段開到「後續」、VPVR 本次、回補水位只開 Q4、情境中性、時間 6 個月
const mkState=PH=>({open:PH.length, ev:false, jh:true, fib:{q3:false,q4:true}, sc:'base', vp:PH.map(()=>'wave'), ma:PH.map(()=>false), maShow:new Set(MAS.map(m=>m[0])), sp:{y10:true,hy:true,ig:true}, fold:{oil:false,rates:false,margin:false}, range:'6m'});
let st = mkState(PH);

let S = DATA.series;
// 頁首：顯示回放終點那天的收盤，不透露之後的價格
// 頁首：最後開啟階段的股價區間（上一段結束日收盤 – 本段結束日收盤），小字寫日期範圍與漲跌幅
let LASTEL=document.getElementById('last'), CHGEL=document.getElementById('chg');
function setHeader(ph){
  const md=d=>d.slice(5).replace('-','/'), last=LASTEL, chg=CHGEL;
  if(!ph){ const h=S.find(p=>p.d===DATA.high); last.textContent=h.c.toFixed(2); chg.textContent=`${md(h.d)} 收盤高點`; chg.className='chg'; return; }
  const a = S.find(p=>p.d===ph.start), b=S.find(p=>p.d===ph.end);   // 起點＝上一段結束日收盤（下跌段＝6/22）
  const pct=(b.c/a.c-1)*100;
  last.textContent=`${a.c.toFixed(2)} – ${b.c.toFixed(2)}`;
  chg.textContent=`${ph.key}｜${md(a.d)} – ${md(b.d)}｜${pct>=0?'+':''}${pct.toFixed(2)}%`;
  chg.className='chg '+(pct>=0?'up':'dn');
}

const evp=document.getElementById('evp');
function closeEv(){ evp.classList.remove('show'); document.body.classList.remove('evopen'); evSel=null; }
document.getElementById('evClose').onclick=()=>{closeEv();render();};
function showEv(k){
  evSel=k; const e=EVENTS[k], md=e.d.slice(5).replace('-','/');
  const g0=leadC().geo, vis=EVENTS.map((o,i)=>i).filter(i=>EVENTS[i].d<=(g0?g0.endD:'9999'));
  const pi=vis.indexOf(k);
  document.getElementById('evBody').innerHTML=
    `<div class="d">${e.d}</div><h3>${e.t}</h3><span class="tag ${e.s==='up'?'up':'dn'}">${e.s==='up'?'利好':'利空'}</span>`+
    `<p>${e.x}</p><div class="src">出處：${e.src}</div>`+
    `<div class="nav"><button ${pi>0?'':'disabled'} data-go="${vis[pi-1]}">‹ 上一則</button><button ${pi<vis.length-1?'':'disabled'} data-go="${vis[pi+1]}">下一則 ›</button></div>`;
  document.querySelectorAll('#evBody [data-go]').forEach(b=>b.onclick=()=>{showEv(+b.dataset.go);render();});
  evp.classList.add('show'); document.body.classList.add('evopen');
}

// ---- controls：每張圖各自一排（C.st 為該圖狀態）
let tabs, mas, ranges, info, evToggle;
function buildBar(C){
const st=C.st, PH=C.PH, tabs=C.tabs, mas=C.mas, ranges=C.ranges;
const closeMenus=()=>[...tabs.children].forEach(t=>t.classList.remove('open'));
PH.forEach((n,i)=>{
  const t=document.createElement('span'); t.className='tab';
  t.innerHTML=`<span class="nm2"><i class="sw" style="background:${SHADE[i]}"></i>${n.key}<span class="win"></span></span>`+
    `<span class="car"><svg viewBox="0 0 10 10"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>`+
    `<span class="menu">`+
      `<div class="hd vprow" data-act="vp"><span class="box"></span>VPVR<small class="cw"></small><span class="arr">›</span>`+
        `<span class="fly">${Object.entries(WIN).map(([k,v])=>`<div data-w="${k}">${v}<small>${k==='wave'?(n.extra?fmtD(n.prof.wave.start):'6/22')+' 起':''}</small></div>`).join('')}</span></div>`+
      `<hr><div class="hd" data-act="ma"><span class="box"></span>均線<small>月／季／半年／年</small></div>`+
    `</span>`;
  // 點名稱：未開→開到這段（含前面）；已開→關掉這段與後面
  t.querySelector('.nm2').onclick=()=>{closeMenus();st.open = (i<st.open)? i : i+1;render();};
  t.querySelector('.car').onclick=e=>{e.stopPropagation();const o=t.classList.contains('open');closeMenus();if(!o)t.classList.add('open');};
  t.querySelector('[data-act=vp]').onclick=e=>{e.stopPropagation();st.vp[i]=st.vp[i]?null:'wave';render();};
  t.querySelector('[data-act=ma]').onclick=e=>{e.stopPropagation();st.ma[i]=!st.ma[i];if(st.ma[i])st.maShow=new Set(MAS.map(m=>m[0]));render();};
  t.querySelectorAll('[data-w]').forEach(d=>d.onclick=e=>{e.stopPropagation();st.vp[i]=d.dataset.w;render();});
  tabs.appendChild(t);
});
document.addEventListener('click',e=>{ if(!tabs.contains(e.target)) closeMenus(); });
MAS.forEach(([k,l,c])=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.innerHTML=`<i style="background:${c}"></i>${l}`;
  b.onclick=()=>{ if(b.classList.contains('dis'))return; st.maShow.has(k)?st.maShow.delete(k):st.maShow.add(k); render(); };
  mas.appendChild(b);});
if(C.ev) C.ev.onclick=()=>{st.ev=!st.ev; if(!st.ev) closeEv(); render();};
C.jh.onclick=()=>{st.jh=!st.jh; render();};
C.jh.insertAdjacentText('beforeend',JH.map(j=>`${j.lab.slice(3)}（${fmtD(/^\d/.test(C.D.ticker)? j.tw : j.us)}）`).join('／'));   // 離職（11/12）／回任（11/23）；台股為隔天
FIBS.forEach(f=>{const b=document.createElement('button');b.className='chip';b.dataset.k=f.k;b.innerHTML=`<i style="background:${f.col}"></i>回補水位 ${f.lab}`;
  b.onclick=()=>{st.fib[f.k]=!st.fib[f.k];render();};C.fibs.appendChild(b);});
if(C.scs) SCEN[C.D.ticker].forEach(sc=>{const b=document.createElement('button');b.className='chip';b.dataset.k=sc.k;b.innerHTML=`<i style="background:${sc.col}"></i>${sc.lab}`;
  b.onclick=()=>{ st.sc=st.sc===sc.k?null:sc.k; if(st.sc) st.open=PH.length; render(); };C.scs.appendChild(b);});   // 開情境＝自動開到「後續」
RANGES.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip dark';b.textContent=l;b.dataset.k=k;
  b.onclick=()=>{st.range=k;render();};ranges.appendChild(b);});
}

// ---- chart
let svg=document.getElementById('svg'), tip=document.getElementById('tip'), box=document.getElementById('chart');
const NS='http://www.w3.org/2000/svg';
const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const fmtD=d=>d.slice(5).replace('-','/');
// 黃仁勛離職（11/12 宣布）／回任（11/23 宣布）：美股取當天收盤，台股（代號數字開頭）取隔一交易日收盤（台股隔天才反應）
const JH=[{lab:'黃仁勛離職',us:'2026-11-12',tw:'2026-11-13'},{lab:'黃仁勛回任',us:'2026-11-23',tw:'2026-11-24'}];
const JHCOL='#8b5cf6';
const jhPts=(S,code,endD)=>JH.map(j=>{ const d=/^\d/.test(code)? j.tw : j.us, p=S.find(q=>q.d===d); return p&&d<=endD? {...j,d,c:p.c} : null; }).filter(Boolean);
let geo=null;
// 回補水位的高低點：6/22 收盤高點、高點到下跌段終點間的最低收盤
// 每檔各自算：在下跌段（6/22 → 7/29）內找最高收盤（SOXX 即 6/22），低點＝該高點之後到下跌段終點的最低收盤
// Q4：10/6（TSM、2454 用 10/5）→ 11/20 區間，同一算法（區間內最高收盤 → 之後到區間終點的最低收盤）
const Q4START={TSM:'2026-10-05','2454':'2026-10-05'};
// endLo＝低點固定取區間終點那天（Q4 一律用 11/20 收盤，即使區間內有更低的收盤，如 AMD 11/5）
const hiLo=(S,a,b,endLo)=>{ const w=S.filter(p=>p.d>=a&&p.d<=b); if(!w.length) return null; const hi=w.reduce((x,y)=>y.c>x.c?y:x);
  return [hi, endLo? w[w.length-1] : w.filter(p=>p.d>=hi.d).reduce((x,y)=>y.c<x.c?y:x)]; };
const FIBS=[{k:'q3',lab:'Q3',col:'#57606a',edge:'#c9ced4',txt:'#1f2328',rng:PH=>[PH[0].start,PH[0].end]},
            {k:'q4',lab:'Q4',col:'#57606a',edge:'#c9ced4',txt:'#1f2328',rng:(PH,code)=>[Q4START[code]||'2026-10-06','2026-11-20',true]}];
const fibOf=(S,PH,code)=>Object.fromEntries(FIBS.map(f=>[f.k,hiLo(S,...f.rng(PH,code))]));
let FB=fibOf(S,PH,ALL.ticker);
// ---- 情境模擬（手動設定）：路徑關鍵點 [第幾個交易日, 價格]，第 0 天＝最新收盤；band/bands＝震盪區間
// 只是示意路徑，關鍵點之間直線連接；交易日跳過美股假日
const SCEN={
  SOXX:[
    {k:'bear',lab:'悲觀',col:'#1a7f37',desc:'跌破 120（未設下檔目標，路徑僅示意）',band:[null,120],
     kp:[[5,132],[11,118],[17,123],[24,112],[31,116],[38,107],[45,110]]},
    {k:'base',lab:'中性',col:'#b45309',desc:'反彈到 140，之後在 120–140 震盪',band:[120,140],peak:140,
     kp:[[8,140],[14,122],[20,138],[26,121],[32,139],[38,123],[45,131]]},
    {k:'bull',lab:'樂觀',col:'#d1242f',desc:'反彈到 155，之後在 140–155 震盪',band:[140,155],peak:155,
     kp:[[10,155],[16,141],[22,153],[28,140.5],[34,154],[40,142],[45,149]]},
  ],
  // 0050：情境起點＝11/25 收盤 90.3（原 11/25 盤中 87 已移除、關鍵點天數已減 1）
  '0050':[
    {k:'bear',lab:'悲觀',col:'#1a7f37',desc:'跌破 84（未設下檔目標，路徑僅示意）',bands:[[0,44,null,84]],
     kp:[[4,89],[10,83],[16,85],[23,79],[30,81],[37,76],[44,77]]},
    {k:'base',lab:'中性',col:'#b45309',desc:'反彈到 94，之後在 84–94 震盪',bands:[[0,44,84,94]],peak:94,

  if(SC){

  // ---- 副圖 A：10Y 殖利率（左軸 %）× 信用利差（右軸 bp）
  caret('rates',A0-10);

  mt.addEventListener('click',()=>{st.fold.margin=!st.fold.margin;render();});
  if(!st.fold.margin){
    const lastIdx=d=>{ let k=-1; for(let i=0;i<pts.length;i++){ if(pts[i].d<=d) k=i; else break; } return k; };

  geo={pts,cut,x,y,m,W,H,TH,L0,L1,lo,hi,P,showMA,cross,hline,dot,endD,SC,SP,FUT,NX};

function hover(e,MAIN){
  if(!geo)return; const {pts,cut,x,y,m,W,H,TH,L0,L1,lo,hi,P,showMA,cross,hline,dot,endD,SC,SP,FUT,NX}=geo;
  const r=svg.getBoundingClientRect(), sx=(e.clientX-r.left)*W/r.width, sy=(e.clientY-r.top)*TH/r.height;
  if(sx<m.l||sx>W-m.r||sy<m.t||sy>L1||cut<1){hide();return;}
  const inP=sy<=H-m.b;
  const iRaw=Math.round((sx-m.l)/(W-m.l-m.r)*(NX-1)), fut=SC&&iRaw>=pts.length;
  const i=fut? Math.min(NX-1,iRaw) : Math.min(cut-1,iRaw), p=fut? {d:FUT[i-pts.length+1-1],c:SP[i-pts.length+1]} : pts[i];
  if(fut){
    cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.setAttribute('visibility','visible');
    hline.setAttribute('visibility','hidden');
    dot.setAttribute('cx',x(i));dot.setAttribute('cy',y(p.c));dot.setAttribute('visibility','visible');
    const fb=FIBS.filter(f=>st.fib[f.k]&&FB[f.k]).map(f=>{const [H,L]=FB[f.k];return `回補水位 ${f.lab}：${((p.c-L.c)/(H.c-L.c)*100).toFixed(1)}%`;}).join('<br>');
    tip.innerHTML=`<b>${p.d}</b>　<span style="color:${SC.col}">${SC.live&&i-pts.length+1===SC.live.j?`${SC.live.lab}價 ${p.c.toFixed(2)}`:`情境（${SC.lab}）模擬 ${p.c.toFixed(2)}`}</span>${fb?'<br>'+fb:''}<br><span style="color:#8c959f">示意路徑，非預測</span>`;
    tip.style.display='block';
    const bx=box.getBoundingClientRect(); let lx=e.clientX-bx.left+14; if(lx+tip.offsetWidth>bx.width) lx-=tip.offsetWidth+28;
    tip.style.left=lx+'px'; tip.style.top=(e.clientY-bx.top+14)+'px'; return;
  }
  cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.setAttribute('visibility','visible');
  // 浮標一律吸附當天收盤（2026-11-26 使用者要求：滑鼠在圖上任何高度都顯示該日收盤，不跟游標價位）
  const yc=y(p.c); hline.setAttribute('y1',yc);hline.setAttribute('y2',yc);hline.setAttribute('visibility',inP?'visible':'hidden');
  dot.setAttribute('cx',x(i));dot.setAttribute('cy',y(p.c));dot.setAttribute('visibility','visible');
  const maTxt=showMA?MAS.filter(([k])=>st.maShow.has(k)&&p[k]!=null).map(([k,l])=>`${l}：${p[k].toFixed(2)}`).join('<br>'):'';
  let vpTxt='';
  if(P&&inP){const j=Math.floor((p.c-P.b0)/P.bin), bv=(j>=0&&j<P.v.length)?P.v[j]:0;
    vpTxt=`<br><span style="color:#57606a">收盤所在 VPVR ${+(P.b0+j*P.bin).toFixed(2)}–${+(P.b0+(j+1)*P.bin).toFixed(2)}：${(bv/1e4).toLocaleString('zh-TW',{maximumFractionDigits:0})} 萬股</span>`;}
  const mac=`<br>${st.sp.y10?`<span style="color:#D97706">10Y ${p.y10!=null?p.y10.toFixed(2)+'%':'—'}</span>`:''}${st.sp.ig?`　<span style="color:#1D7A46">投資級 ${p.ig??'—'} bp</span>`:''}${st.sp.hy?`　<span style="color:#22262B">垃圾級 ${p.hy??'—'} bp</span>`:''}`;
  const mo=(!MAIN||st.fold.margin)?null:DATA.margin.filter(o=>o.d<=p.d&&o.d<=endD).pop();
  const oTxt=(MAIN&&!st.fold.oil&&p.wti!=null)?`<br><span style="color:#3B7DD8">WTI ${p.wti.toFixed(2)} 美元</span>`:'';
  const mgTxt=mo?`<br><span style="color:#2E7D5B">融資年增（${+mo.m.slice(5)}月）${mo.yoy}%</span>`:'';
  const fbTxt=FIBS.filter(f=>st.fib[f.k]&&FB[f.k]).map(f=>{const [H,L]=FB[f.k];return `回補水位 ${f.lab}：${((p.c-L.c)/(H.c-L.c)*100).toFixed(1)}%`;}).join('<br>');
  tip.innerHTML=`<b>${p.d}</b>　收盤 ${p.c.toFixed(2)}${fbTxt?'<br>'+fbTxt:''}${maTxt?'<br>'+maTxt:''}${oTxt}${(!MAIN||st.fold.rates)?'':mac}${mgTxt}${vpTxt}`;
  tip.style.display='block';
  const bx=box.getBoundingClientRect(); let lx=e.clientX-bx.left+14; if(lx+tip.offsetWidth>bx.width) lx-=tip.offsetWidth+28;
  tip.style.left=lx+'px'; tip.style.top=(e.clientY-bx.top+14)+'px';
}
function hide(){ if(!geo)return; tip.style.display='none'; ['cross','hline','dot'].forEach(k=>geo[k].setAttribute('visibility','hidden')); }
CHARTS.forEach(C=>{ C.box.addEventListener('mousemove',e=>{use(C);hover(e,C.macro);}); C.box.addEventListener('mouseleave',()=>{use(C);hide();}); });
window.addEventListener('resize',render);
render();
if(location.hash==='#stock') document.querySelector('#pages [data-p=stock]').click();   // 網址加 #stock 直接開個股頁
</script>
</body>
</html>
